name: Feature Request
description: Suggest a new feature or improvement
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Cobblemon Spawning REI better? Let us know!

  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: What feature would you like added?
      placeholder: "Show shiny encounter rates in spawn displays"
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case / Problem
      description: Why would this be useful? What problem does it solve?
      placeholder: "Players want to know which biomes have better shiny rates for specific Pokemon"
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: How do you envision this working?
      placeholder: "Add a shiny icon with percentage in the spawn condition display"
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Are there other ways to solve this problem?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Mockups, examples, links, or other details
    validations:
      required: false
