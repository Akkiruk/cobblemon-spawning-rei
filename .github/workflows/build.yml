name: Build Validation

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: cobblemon-spawning-rei

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          cd cobblemon-spawning-rei
          chmod +x gradlew
          ./gradlew :fabric:build :neoforge:build

      - name: Upload Fabric artifact
        uses: actions/upload-artifact@v6
        with:
          name: fabric-build
          path: cobblemon-spawning-rei/fabric/build/libs/*.jar
          retention-days: 7

      - name: Upload NeoForge artifact
        uses: actions/upload-artifact@v6
        with:
          name: neoforge-build
          path: cobblemon-spawning-rei/neoforge/build/libs/*.jar
          retention-days: 7
