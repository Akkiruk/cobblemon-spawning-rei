name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels:
      - 'enhancement'
      - 'feature'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: '📊 REI Integration'
    labels:
      - 'rei'
  - title: '🌍 Spawning System'
    labels:
      - 'spawning'
  - title: '🔄 Evolution System'
    labels:
      - 'evolution'
  - title: '📦 Dependencies'
    labels:
      - 'dependencies'
  - title: '🔧 Maintenance'
    labels:
      - 'chore'
      - 'maintenance'
      - 'ci'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
  minor:
    labels:
      - 'minor'
      - 'enhancement'
      - 'feature'
  patch:
    labels:
      - 'patch'
      - 'bug'
      - 'fix'
  default: patch

autolabeler:
  - label: 'documentation'
    files:
      - '*.md'
      - '.github/**/*'
  - label: 'bug'
    title:
      - '/fix/i'
      - '/bug/i'
      - '/crash/i'
  - label: 'enhancement'
    title:
      - '/feat/i'
      - '/add/i'
      - '/feature/i'
  - label: 'rei'
    files:
      - '**/rei/**/*'
      - '**/*Display*.kt'
      - '**/*Category*.kt'
  - label: 'spawning'
    files:
      - '**/*Spawn*.kt'
      - '**/*Biome*.kt'

template: |
  ## Changes

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
